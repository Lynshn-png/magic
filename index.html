<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Magic</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#000;color:#fff;font-family:sans-serif;overflow:hidden}
#lobby{position:fixed;inset:0;background:#000;display:flex;align-items:center;justify-content:center;z-index:100}
.card{width:90%;max-width:360px;text-align:center}
.card h1{font-size:22px;margin-bottom:20px;letter-spacing:3px}
.card input{width:100%;padding:14px;margin:10px 0;background:#111;border:1px solid #333;border-radius:10px;color:#fff;text-align:center;font-size:16px;outline:none}
.card button{width:100%;padding:14px;margin-top:15px;background:#fff;color:#000;border:none;border-radius:10px;font-weight:bold;cursor:pointer}
#container{display:flex;height:100vh;background:#000}
#left{flex:1;position:relative;background:#000;border-right:1px solid #222}
#left video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
#right{flex:1.2;background:#000}
#right canvas{width:100%;height:100%;display:block}
#hint{position:absolute;bottom:15px;left:15px;font-size:11px;opacity:0.5}
</style>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/hands.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>
</head>
<body>
<div id="lobby">
  <div class="card">
    <h1>MAGIC</h1>
    <input id="textInput" placeholder="input kalimat">
    <input id="emojiInput" placeholder="input emoji">
    <button onclick="startApp()">START</button>
  </div>
</div>
<div id="container">
  <div id="left"><video id="video" autoplay playsinline></video><div id="hint">✊ LOVE<br>✌️ TEXT<br>👌 BLACKHOLE</div></div>
  <div id="right"><canvas id="particleCanvas"></canvas></div>
</div>
<script>
let customText="", customEmoji="";
function startApp(){
  customText=document.getElementById('textInput').value.trim();
  customEmoji=document.getElementById('emojiInput').value.trim();
  if(!customText||!customEmoji){alert("isi kalimat & emoji dulu");return}
  document.getElementById('lobby').style.display='none';
  initMagic();
}
let canvas,ctx,W,H,particles=[],mode="TEXT";
function initMagic(){
  canvas=document.getElementById('particleCanvas');
  ctx=canvas.getContext('2d');
  function resize(){
    const rect=canvas.getBoundingClientRect();
    W=canvas.width=rect.width*window.devicePixelRatio;
    H=canvas.height=rect.height*window.devicePixelRatio;
    ctx.scale(window.devicePixelRatio,window.devicePixelRatio);
    W=rect.width; H=rect.height;
  }
  resize();
  window.addEventListener('resize',resize);
  class P{constructor(){this.x=Math.random()*W;this.y=Math.random()*H;this.tx=this.x;this.ty=this.y;this.vx=0;this.vy=0}update(){this.vx+=(this.tx-this.x)*0.07;this.vy+=(this.ty-this.y)*0.07;this.vx*=0.85;this.vy*=0.85;this.x+=this.vx;this.y+=this.vy}draw(){if(mode=='LOVE'){ctx.font='18px serif';ctx.fillText(customEmoji,this.x,this.y)}else{ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(this.x,this.y,1.8,0,Math.PI*2);ctx.fill()}}}
  particles=[];
  for(let i=0;i<1200;i++) particles.push(new P());
  function getTextPoints(txt){
    const off=document.createElement('canvas');
    off.width=W; off.height=H;
    const o=off.getContext('2d');
    o.fillStyle='#fff';
    o.font=`bold 52px Arial`;
    o.textAlign='center'; o.textBaseline='middle';
    o.fillText(txt,W/2,H/2);
    const d=o.getImageData(0,0,W,H).data,pts=[];
    for(let y=0;y<H;y+=5)for(let x=0;x<W;x+=5)if(d[(y*W+x)*4+3]>128)pts.push({x,y});
    return pts.length?pts:[{x:W/2,y:H/2}];
  }
  function getHeartPoints(){
    const pts=[],s=Math.min(W,H)*0.22,cx=W/2,cy=H/2;
    for(let t=0;t<Math.PI*2;t+=0.06){
      const x=16*Math.pow(Math.sin(t),3),y=-(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t));
      pts.push({x:cx+x*s/16,y:cy+y*s/16});
    }
    return pts;
  }
  function setMode(m){
    if(mode===m)return;
    mode=m;
    let targets=m=='LOVE'?getHeartPoints():m=='BLACKHOLE'?[]:getTextPoints(customText);
    for(let i=0;i<particles.length;i++){
      const t=targets[i%targets.length];
      if(t){particles[i].tx=t.x;particles[i].ty=t.y}
    }
  }
  function animate(){
    ctx.fillStyle='rgba(0,0,0,0.25)';
    ctx.fillRect(0,0,W,H);
    if(mode=='BLACKHOLE'){
      const cx=W/2,cy=H/2;
      particles.forEach(p=>{
        const dx=p.x-cx,dy=p.y-cy,r=Math.sqrt(dx*dx+dy*dy)+0.1;
        const ang=Math.atan2(dy,dx)+0.05+400/r*0.02;
        p.tx=cx+Math.cos(ang)*r;
        p.ty=cy+Math.sin(ang)*r;
      });
    }
    particles.forEach(p=>{p.update();p.draw()});
    requestAnimationFrame(animate);
  }
  animate();
  setTimeout(()=>setMode('TEXT'),300);
  const video=document.getElementById('video');
  const hands=new Hands({locateFile:(f)=>`https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/${f}`});
  hands.setOptions({maxNumHands:1,minDetectionConfidence:0.7,minTrackingConfidence:0.7});
  hands.onResults(r=>{
    if(!r.multiHandLandmarks||!r.multiHandLandmarks.length)return;
    const lm=r.multiHandLandmarks[0];
    const isFist=lm[8].y>lm[6].y&&lm[12].y>lm[10].y;
    const isPeace=lm[8].y<lm[6].y&&lm[12].y<lm[10].y&&lm[16].y>lm[14].y;
    const isOk=Math.hypot(lm[4].x-lm[8].x,lm[4].y-lm[8].y)<0.05;
    if(isOk)setMode('BLACKHOLE');
    else if(isPeace)setMode('TEXT');
    else if(isFist)setMode('LOVE');
  });
  const cam=new Camera(video,{onFrame:async()=>{await hands.send({image:video})},width:640,height:480});
  cam.start();
}
</script>
</body>
</html>
