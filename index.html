<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Magic</title>
<style>body{margin:0;background:#000;color:#fff;font-family:sans-serif;overflow:hidden}#lobby{position:fixed;inset:0;background:#000;display:flex;align-items:center;justify-content:center;z-index:99}.card{width:90%;max-width:320px;text-align:center}input{width:100%;padding:14px;margin:8px 0;background:#111;border:1px solid #333;border-radius:10px;color:#fff;text-align:center;font-size:16px}button{background:#fff;color:#000;border:none;padding:14px 20px;border-radius:10px;font-weight:bold;width:100%;cursor:pointer;margin-top:10px}#main{display:flex;height:100vh}#left{flex:1;background:#000;position:relative}#left video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}#right{flex:1.2;background:#000;position:relative}canvas{width:100%;height:100%}#btns{position:absolute;top:10px;left:50%;transform:translateX(-50%);display:flex;gap:8px;z-index:10}#btns button{width:auto;padding:8px 14px;font-size:12px;background:rgba(255,255,255,0.15);color:#fff;border:1px solid #444;backdrop-filter:blur(5px)}</style>
</head><body>
<div id="lobby"><div class="card"><h2>MAGIC</h2><input id="t" placeholder="input kalimat"><input id="e" placeholder="input emoji"><button onclick="go()">START</button></div></div>
<div id="main">
<div id="left"><video id="v" autoplay playsinline muted></video></div>
<div id="right"><div id="btns"><button onclick="setMode('LOVE')">LOVE</button><button onclick="setMode('TEXT')">TEXT</button><button onclick="setMode('BLACKHOLE')">HOLE</button></div><canvas id="c"></canvas></div>
</div>
<script>
let txt,emo,c,ctx,W,H,parts=[],mode='TEXT';
function go(){
 txt=document.getElementById('t').value; emo=document.getElementById('e').value;
 if(!txt||!emo){alert('isi dulu');return}
 document.getElementById('lobby').style.display='none';
 init();
}
function init(){
 c=document.getElementById('c'); ctx=c.getContext('2d');
 function rs(){W=c.width=c.clientWidth; H=c.height=c.clientHeight} rs();
 class P{constructor(){this.x=Math.random()*W;this.y=Math.random()*H;this.tx=W/2;this.ty=H/2}update(){this.x+=(this.tx-this.x)*0.08;this.y+=(this.ty-this.y)*0.08}draw(){if(mode=='LOVE'){ctx.font='20px serif';ctx.fillText(emo,this.x,this.y)}else{ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(this.x,this.y,2,0,7);ctx.fill()}}}
 for(let i=0;i<1000;i++) parts.push(new P());
 function getPoints(str){
  let oc=document.createElement('canvas'); oc.width=W; oc.height=H;
  let o=oc.getContext('2d'); o.fillStyle='#fff'; o.font='bold 60px Arial'; o.textAlign='center'; o.textBaseline='middle'; o.fillText(str,W/2,H/2);
  let d=o.getImageData(0,0,W,H).data, pts=[];
  for(let y=0;y<H;y+=6) for(let x=0;x<W;x+=6) if(d[(y*W+x)*4+3]>10) pts.push({x,y});
  return pts;
 }
 window.setMode=(m)=>{
  mode=m;
  let pts=m=='LOVE'?(()=>{let a=[];for(let t=0;t<6.28;t+=0.07){let x=16*Math.pow(Math.sin(t),3),y=-(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t));a.push({x:W/2+x*8,y:H/2+y*8})}return a})():m=='BLACKHOLE'?[]:getPoints(txt);
  if(m=='BLACKHOLE') return;
  for(let i=0;i<parts.length;i++){let p=pts[i%pts.length]; if(p){parts[i].tx=p.x; parts[i].ty=p.y}}
 };
 function loop(){
  ctx.fillStyle='rgba(0,0,0,0.3)'; ctx.fillRect(0,0,W,H);
  if(mode=='BLACKHOLE'){let cx=W/2,cy=H/2; parts.forEach(p=>{let dx=p.x-cx,dy=p.y-cy,r=Math.sqrt(dx*dx+dy*dy)+1,a=Math.atan2(dy,dx)+0.1; p.tx=cx+Math.cos(a)*r; p.ty=cy+Math.sin(a)*r; p.x+=(p.tx-p.x)*0.05; p.y+=(p.ty-p.y)*0.05; p.draw()})}else{parts.forEach(p=>{p.update();p.draw()})}
  requestAnimationFrame(loop);
 }
 loop(); setMode('TEXT');
 navigator.mediaDevices.getUserMedia({video:true}).then(s=>{document.getElementById('v').srcObject=s});
}
</script>
</body></html>
